<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#070a12; font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title>The Network State: 7-Phase Formation Morphogenesis</title>
  <desc>Visualizing Network State Formation: From 1 Founder to 1,000,000 Sovereign Citizens across physical nodes and cryptographic jurisdiction. Inspired by Balaji Srinivasan's The Network State.</desc>

  <!-- LICENSE: Creative Commons CC0 / Public Domain (Free Culture) -->

  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#11192e" />
      <stop offset="50%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#05070d" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a243b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f1626" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="greenAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1600" height="900" fill="url(#bgGlow)" />

  <!-- SUBTLE BACKGROUND GRID LINES -->
  <g stroke="#1e293b" stroke-width="0.75" opacity="0.35">
    <line x1="0" y1="180" x2="1600" y2="180" />
    <line x1="0" y1="360" x2="1600" y2="360" />
    <line x1="0" y1="540" x2="1600" y2="540" />
    <line x1="0" y1="720" x2="1600" y2="720" />
    <line x1="200" y1="0" x2="200" y2="900" />
    <line x1="400" y1="0" x2="400" y2="900" />
    <line x1="600" y1="0" x2="600" y2="900" />
    <line x1="800" y1="0" x2="800" y2="900" />
    <line x1="1000" y1="0" x2="1000" y2="900" />
    <line x1="1200" y1="0" x2="1200" y2="900" />
    <line x1="1400" y1="0" x2="1400" y2="900" />
  </g>

  <!-- HEADER AREA -->
  <g transform="translate(80, 55)">
    <text x="0" y="32" fill="#f8fafc" font-size="34" font-weight="800" letter-spacing="-0.5">HOW TO BUILD A NETWORK STATE</text>
    <text x="0" y="62" fill="#38bdf8" font-size="16" font-weight="600">The 7-Phase Morphogenesis: From 1 Founder to 1,000,000 Sovereign Citizens</text>
    
    <!-- Badges -->
    <rect x="1100" y="8" width="340" height="42" rx="8" fill="#111c33" stroke="#2563eb" stroke-width="1.5" />
    <circle cx="1124" cy="29" r="6" fill="#10b981" />
    <text x="1140" y="34" fill="#e2e8f0" font-size="12" font-weight="700">CANONICAL BLUEPRINT • 16:9 EDITION</text>
    <text x="1140" y="47" fill="#94a3b8" font-size="9.5">Based on Balaji Srinivasan’s The Network State (CC0)</text>
  </g>

  <!-- MAIN SPINE / FLOW LINE (Connecting 7 Phases) -->
  <path d="M 120 480 C 350 480, 450 320, 750 320 C 1050 320, 1150 480, 1480 480" fill="none" stroke="url(#cyanLine)" stroke-width="4" opacity="0.8" />

  <!-- PHASE 1: STARTUP SOCIETY -->
  <g transform="translate(60, 400)">
    <rect width="180" height="230" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="90" cy="-20" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <text x="90" y="-15" fill="#f8fafc" font-size="12" font-weight="800" text-anchor="middle">1</text>
    
    <text x="90" y="32" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">FOUND A STARTUP</text>
    <text x="90" y="50" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">SOCIETY</text>
    
    <text x="90" y="78" fill="#facc15" font-size="11" font-weight="700" text-anchor="middle">N = 1 Founder</text>
    
    <text x="15" y="105" fill="#cbd5e1" font-size="10.5">
      <tspan x="15" dy="0">• Postulate moral premise</tspan>
      <tspan x="15" dy="18">• One core proposition</tspan>
      <tspan x="15" dy="18">• Found online society</tspan>
      <tspan x="15" dy="18">• Publish manifesto</tspan>
      <tspan x="15" dy="18">• Zero territorial footprint</tspan>
    </text>

    <!-- Mini Visual -->
    <circle cx="90" cy="195" r="14" fill="#0369a1" opacity="0.6"/>
    <circle cx="90" cy="195" r="6" fill="#f8fafc" />
  </g>

  <!-- PHASE 2: DIGITAL COMMUNION -->
  <g transform="translate(270, 260)">
    <rect width="180" height="230" rx="12" fill="url(#cardGrad)" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="90" cy="-20" r="16" fill="#2563eb" stroke="#60a5fa" stroke-width="2" />
    <text x="90" y="-15" fill="#f8fafc" font-size="12" font-weight="800" text-anchor="middle">2</text>
    
    <text x="90" y="32" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">BUILD ONLINE</text>
    <text x="90" y="50" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">COMMUNITY</text>
    
    <text x="90" y="78" fill="#facc15" font-size="11" font-weight="700" text-anchor="middle">N = 1,000 Netizens</text>
    
    <text x="15" y="105" fill="#cbd5e1" font-size="10.5">
      <tspan x="15" dy="0">• Daily digital communion</tspan>
      <tspan x="15" dy="18">• Shared moral discipline</tspan>
      <tspan x="15" dy="18">• High-trust social graph</tspan>
      <tspan x="15" dy="18">• Continuous onboarding</tspan>
      <tspan x="15" dy="18">• Collective culture sync</tspan>
    </text>

    <!-- Mini Visual: Cluster -->
    <g transform="translate(90, 195)">
      <circle cx="0" cy="0" r="8" fill="#3b82f6" />
      <circle cx="-16" cy="4" r="5" fill="#60a5fa" />
      <circle cx="16" cy="4" r="5" fill="#60a5fa" />
      <circle cx="0" cy="-14" r="5" fill="#60a5fa" />
    </g>
  </g>

  <!-- PHASE 3: CRYPTOECONOMIC UNION -->
  <g transform="translate(480, 190)">
    <rect width="180" height="230" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="90" cy="-20" r="16" fill="#7c3aed" stroke="#a855f7" stroke-width="2" />
    <text x="90" y="-15" fill="#f8fafc" font-size="12" font-weight="800" text-anchor="middle">3</text>
    
    <text x="90" y="32" fill="#a855f7" font-size="13" font-weight="700" text-anchor="middle">CRYPTOECONOMIC</text>
    <text x="90" y="50" fill="#a855f7" font-size="13" font-weight="700" text-anchor="middle">UNION</text>
    
    <text x="90" y="78" fill="#facc15" font-size="11" font-weight="700" text-anchor="middle">N = 10,000 Citizens</text>
    
    <text x="15" y="105" fill="#cbd5e1" font-size="10.5">
      <tspan x="15" dy="0">• Onchain governance</tspan>
      <tspan x="15" dy="18">• Sovereign treasury vault</tspan>
      <tspan x="15" dy="18">• Internal micro-economy</tspan>
      <tspan x="15" dy="18">• Cryptographic identity</tspan>
      <tspan x="15" dy="18">• Mutual aid protocol</tspan>
    </text>

    <!-- Mini Visual: Token / Vault -->
    <g transform="translate(90, 195)">
      <polygon points="0,-12 12,0 0,12 -12,0" fill="#c084fc" stroke="#f8fafc" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#581c87" />
    </g>
  </g>

  <!-- PHASE 4: PHYSICAL PRESENCE (CROWDFUND TERRITORY) -->
  <g transform="translate(690, 190)">
    <rect width="180" height="230" rx="12" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="90" cy="-20" r="16" fill="#db2777" stroke="#ec4899" stroke-width="2" />
    <text x="90" y="-15" fill="#f8fafc" font-size="12" font-weight="800" text-anchor="middle">4</text>
    
    <text x="90" y="32" fill="#ec4899" font-size="13" font-weight="700" text-anchor="middle">CROWDFUND</text>
    <text x="90" y="50" fill="#ec4899" font-size="13" font-weight="700" text-anchor="middle">TERRITORY</text>
    
    <text x="90" y="78" fill="#facc15" font-size="11" font-weight="700" text-anchor="middle">N = 50,000 Nodes</text>
    
    <text x="15" y="105" fill="#cbd5e1" font-size="10.5">
      <tspan x="15" dy="0">• Co-living hubs &amp; cul-de-sacs</tspan>
      <tspan x="15" dy="18">• Global physical footprint</tspan>
      <tspan x="15" dy="18">• Crowdfunded real estate</tspan>
      <tspan x="15" dy="18">• Permanent pop-up cities</tspan>
      <tspan x="15" dy="18">• Cloud-linked properties</tspan>
    </text>

    <!-- Mini Visual: Houses / Real Estate -->
    <g transform="translate(90, 195)">
      <polygon points="0,-14 12,0 -12,0" fill="#f472b6" />
      <rect x="-9" y="0" width="18" height="12" fill="#be185d" />
      <rect x="-3" y="4" width="6" height="8" fill="#fdf2f8" />
    </g>
  </g>

  <!-- PHASE 5: PHYSICAL ARCHIPELAGO -->
  <g transform="translate(900, 260)">
    <rect width="180" height="230" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="90" cy="-20" r="16" fill="#d97706" stroke="#f59e0b" stroke-width="2" />
    <text x="90" y="-15" fill="#f8fafc" font-size="12" font-weight="800" text-anchor="middle">5</text>
    
    <text x="90" y="32" fill="#f59e0b" font-size="13" font-weight="700" text-anchor="middle">NETWORK</text>
    <text x="90" y="50" fill="#f59e0b" font-size="13" font-weight="700" text-anchor="middle">ARCHIPELAGO</text>
    
    <text x="90" y="78" fill="#facc15" font-size="11" font-weight="700" text-anchor="middle">N = 100,000 Enclaves</text>
    
    <text x="15" y="105" fill="#cbd5e1" font-size="10.5">
      <tspan x="15" dy="0">• Interlinked physical nodes</tspan>
      <tspan x="15" dy="18">• Non-contiguous sovereignty</tspan>
      <tspan x="15" dy="18">• Decentralized jurisdiction</tspan>
      <tspan x="15" dy="18">• Internal passport / pass</tspan>
      <tspan x="15" dy="18">• Onchain land registry</tspan>
    </text>

    <!-- Mini Visual: Archipelago Network -->
    <g transform="translate(90, 195)">
      <circle cx="-18" cy="-5" r="7" fill="#f59e0b" />
      <circle cx="0" cy="10" r="8" fill="#f59e0b" />
      <circle cx="20" cy="-8" r="6" fill="#f59e0b" />
      <line x1="-18" y1="-5" x2="0" y2="10" stroke="#fde047" stroke-width="1.5" stroke-dasharray="2 2"/>
      <line x1="0" y1="10" x2="20" y2="-8" stroke="#fde047" stroke-width="1.5" stroke-dasharray="2 2"/>
    </g>
  </g>

  <!-- PHASE 6: ONCHAIN CENSUS -->
  <g transform="translate(1110, 400)">
    <rect width="180" height="230" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="90" cy="-20" r="16" fill="#059669" stroke="#10b981" stroke-width="2" />
    <text x="90" y="-15" fill="#f8fafc" font-size="12" font-weight="800" text-anchor="middle">6</text>
    
    <text x="90" y="32" fill="#10b981" font-size="13" font-weight="700" text-anchor="middle">ONCHAIN CENSUS &amp;</text>
    <text x="90" y="50" fill="#10b981" font-size="13" font-weight="700" text-anchor="middle">DIPLOMACY</text>
    
    <text x="90" y="78" fill="#facc15" font-size="11" font-weight="700" text-anchor="middle">N = 500,000 Proven</text>
    
    <text x="15" y="105" fill="#cbd5e1" font-size="10.5">
      <tspan x="15" dy="0">• Real-time provable census</tspan>
      <tspan x="15" dy="18">• Cryptographic net-worth</tspan>
      <tspan x="15" dy="18">• Bilateral sovereign treaties</tspan>
      <tspan x="15" dy="18">• Special Economic Zones</tspan>
      <tspan x="15" dy="18">• Legitimate civil voice</tspan>
    </text>

    <!-- Mini Visual: Cryptographic Seal -->
    <g transform="translate(90, 195)">
      <polygon points="0,-12 10,-5 10,7 0,14 -10,7 -10,-5" fill="none" stroke="#34d399" stroke-width="2" />
      <circle cx="0" cy="1" r="5" fill="#10b981" />
    </g>
  </g>

  <!-- PHASE 7: SOVEREIGN RECOGNITION -->
  <g transform="translate(1320, 480)">
    <rect width="210" height="255" rx="14" fill="#0c1e33" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <circle cx="105" cy="-22" r="18" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <text x="105" y="-17" fill="#f8fafc" font-size="14" font-weight="900" text-anchor="middle">7</text>
    
    <text x="105" y="32" fill="#38bdf8" font-size="15" font-weight="800" text-anchor="middle">DIPLOMATIC</text>
    <text x="105" y="52" fill="#38bdf8" font-size="15" font-weight="800" text-anchor="middle">RECOGNITION</text>
    
    <text x="105" y="80" fill="#facc15" font-size="12" font-weight="800" text-anchor="middle">N = 1,000,000 SOVEREIGN</text>
    
    <text x="18" y="110" fill="#f1f5f9" font-size="11">
      <tspan x="18" dy="0">• De jure sovereignty</tspan>
      <tspan x="18" dy="20">• UN recognition pathway</tspan>
      <tspan x="18" dy="20">• Full passport validity</tspan>
      <tspan x="18" dy="20">• Cloud-first archipelago</tspan>
      <tspan x="18" dy="20">• Sovereign Network State</tspan>
    </text>

    <rect x="25" y="210" width="160" height="30" rx="6" fill="#0369a1" />
    <text x="105" y="230" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">SOVEREIGNTY UNLOCKED</text>
  </g>

  <!-- FOOTER / CITATION & PHILOSOPHY BAR -->
  <g transform="translate(80, 775)">
    <rect width="1440" height="85" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
    
    <text x="25" y="32" fill="#94a3b8" font-size="12" font-weight="700">THE CANONICAL FORMULA:</text>
    <text x="25" y="55" fill="#f8fafc" font-size="13" font-weight="600">
      <tspan fill="#38bdf8">Cloud-First</tspan> → <tspan fill="#60a5fa">Land-Last</tspan> → <tspan fill="#a855f7">Real-Time Onchain Census</tspan> → <tspan fill="#ec4899">Crowdfunded Physical Nodes</tspan> → <tspan fill="#10b981">Diplomatic Sovereignty</tspan>
    </text>

    <text x="960" y="32" fill="#f59e0b" font-size="11" font-weight="700">SUBMISSION DETAILS (CC0 FREE CULTURE):</text>
    <text x="960" y="50" fill="#cbd5e1" font-size="10.5">Author: Lam Vu (lamhu4816-cyber) • Base EVM: 0x24A2151Ec787a2C5c81412A888c3a9d9eEc3beEA</text>
    <text x="960" y="66" fill="#94a3b8" font-size="10">Interactive Engine &amp; Vector Source: thenetworkstate.com/the-network-state-in-one-image</text>
  </g>

</svg>
